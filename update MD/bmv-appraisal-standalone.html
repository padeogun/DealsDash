<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BMV Appraisal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>:root{
  --navy:#1B2A4A; --brick:#C1533C; --ice:#E7ECF3; --gold:#8A6508; --green:#2F6B4F;
  --bg:#E7ECF3; --paper:#FFFFFF; --ink:#1B2A4A; --ink-2:#4A5874; --line:#C9D2DF; --line-2:#DDE3EC;
  --field:#F7F9FC; --neg:#B0442E; --pos:#2F6B4F; --warn-bg:#F6EEDC;
  --serif:"Source Serif 4",Cambria,Georgia,serif; --sans:"Source Sans 3",Calibri,"Segoe UI",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111A2C; --paper:#18233A; --ink:#E7ECF3; --ink-2:#A9B6CC; --line:#2E3C58; --line-2:#24314B;
  --field:#131D31; --neg:#E07A63; --pos:#7DC3A0; --gold:#D6A94A; --warn-bg:#2A2718; --brick:#E07A63; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111A2C; --paper:#18233A; --ink:#E7ECF3; --ink-2:#A9B6CC; --line:#2E3C58; --line-2:#24314B;
  --field:#131D31; --neg:#E07A63; --pos:#7DC3A0; --gold:#D6A94A; --warn-bg:#2A2718; --brick:#E07A63; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
h1{font-size:1.75rem;margin-bottom:.5rem} h2{font-size:1.2rem;margin:1.75rem 0 .75rem} h3{font-size:1rem;margin-bottom:.5rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brick);outline-offset:2px}
.muted{color:var(--ink-2)} small{font-size:.8rem;color:var(--ink-2)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#E7ECF3;padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:1.15rem;font-weight:600;letter-spacing:.01em;margin-right:auto}
.brand span{font-family:var(--sans);font-weight:400;opacity:.7;font-size:.85rem;margin-left:.5rem}
#status{font-size:.8rem;opacity:.75}
.tabs{display:flex;gap:.25rem;width:100%;overflow-x:auto}
.tabs button{background:none;border:0;color:#C9D2DF;padding:.45rem .8rem;border-radius:4px;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{background:rgba(231,236,243,.14);color:#fff}
.tabs button:disabled{opacity:.4;cursor:default}
@media(min-width:760px){.tabs{width:auto}}

main{max-width:1080px;margin:0 auto;padding:1rem 1rem 10rem}
.page{background:var(--paper);border:1px solid var(--line-2);border-radius:6px;padding:1.25rem}
@media(min-width:760px){.page{padding:2rem 2.25rem}}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.lede{color:var(--ink-2);max-width:68ch;margin:.25rem 0 1rem}
.note{background:var(--warn-bg);border-left:3px solid var(--gold);padding:.6rem .8rem;margin:.75rem 0;font-size:.92rem;max-width:72ch}

/* steps: a real sequence, so numbered */
.steps{display:flex;gap:.25rem;overflow-x:auto;margin-bottom:.75rem;padding-bottom:.25rem}
.step{flex:0 0 auto;display:flex;align-items:center;gap:.45rem;background:none;border:1px solid transparent;border-radius:4px;padding:.4rem .7rem;color:var(--ink-2);cursor:pointer;font-size:.92rem}
.step span{display:inline-grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:50%;border:1px solid var(--line);font-size:.75rem}
.step[aria-current="step"]{color:var(--ink);background:var(--paper);border-color:var(--line-2);font-weight:600}
.step[aria-current="step"] span{background:var(--navy);color:#fff;border-color:var(--navy)}
.step-foot{display:flex;justify-content:space-between;gap:.5rem;margin-top:2rem;padding-top:1rem;border-top:1px solid var(--line-2);flex-wrap:wrap}

/* buttons */
.btn{border:1px solid var(--line);background:var(--paper);padding:.5rem .9rem;border-radius:4px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{background:#E7ECF3;color:#1B2A4A;border-color:#E7ECF3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:#E7ECF3;color:#1B2A4A;border-color:#E7ECF3}}
.icon-btn{border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:.82rem;padding:.3rem .4rem;text-decoration:underline;text-underline-offset:2px}
.icon-btn:hover{color:var(--neg)}
.add-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.75rem 0}
.add-row select{max-width:100%;min-width:0;flex:1 1 16rem}

/* fields */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.9rem 1rem}
.fld{display:flex;flex-direction:column;gap:.25rem;font-size:.88rem}
.fld>span{color:var(--ink-2)}
.fld.wide{grid-column:1/-1}
input,select,textarea{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:.45rem .55rem}
textarea{resize:vertical}
input[type=checkbox]{width:1.1rem;height:1.1rem;accent-color:var(--navy);flex:none}
.inp{display:flex;align-items:stretch;background:var(--field);border:1px solid var(--line);border-radius:4px}
.inp input{border:0;background:none}
.inp i{font-style:normal;color:var(--ink-2);padding:.45rem .5rem;font-size:.85rem;display:flex;align-items:center}
.inp:focus-within{outline:2px solid var(--brick);outline-offset:1px}
.inp input:focus-visible{outline:none}

/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl thead th{font-weight:600;color:var(--ink-2);font-size:.82rem;border-bottom:1px solid var(--line)}
.tbl td input,.tbl td select{padding:.35rem .4rem}
.comps{min-width:720px} .rates{min-width:820px} .rates .sm{width:5.5rem}
.kv th{font-weight:400;color:var(--ink-2);width:52%}
.kv td{text-align:right;font-weight:500}
.kv td small{display:block;font-weight:400}
.kv tr.sum th,.kv tr.sum td{border-top:1px solid var(--ink-2);font-weight:600;color:var(--ink)}
.neg,.kv tr.neg td,.sens td.neg{color:var(--neg)}
.sens{min-width:560px} .sens td,.sens thead th:not(:first-child){text-align:right}

/* figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);margin:1.25rem 0}
.fig{background:var(--paper);padding:.8rem 1rem;display:flex;flex-direction:column;gap:.15rem}
.fig span{font-size:.85rem;color:var(--ink-2)} .fig b{font-family:var(--serif);font-size:1.35rem;font-weight:600}
.fig.pos b{color:var(--pos)} .fig.neg b{color:var(--neg)} .fig.quiet b{color:var(--ink-2);font-size:1.1rem}

/* condition */
.grade{border-left:4px solid var(--navy);padding:.7rem 1rem;background:var(--field);display:flex;flex-direction:column;gap:.15rem;margin:.5rem 0 1rem}
.grade b{font-family:var(--serif);font-size:1.25rem}
.g-medium{border-color:var(--gold)} .g-heavy{border-color:var(--brick)}
.cond{display:flex;flex-direction:column}
.cond-row{display:grid;grid-template-columns:1fr auto;gap:.4rem .75rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line-2)}
.cond-note{grid-column:1/-1}
@media(min-width:760px){.cond-row{grid-template-columns:minmax(12rem,1.1fr) auto 1.4fr}.cond-note{grid-column:auto}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:.35rem .7rem;cursor:pointer;font-size:.85rem;border-right:1px solid var(--line);color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg .cr1[aria-checked="true"],.seg .fs-clear[aria-checked="true"]{background:var(--pos);color:#fff}
.seg .cr2[aria-checked="true"],.seg .fs-suspected[aria-checked="true"]{background:var(--gold);color:#fff}
.seg .cr3[aria-checked="true"],.seg .fs-confirmed[aria-checked="true"]{background:var(--brick);color:#fff}

/* works */
.ai-box{border:1px solid var(--line);border-radius:6px;padding:1rem;display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center;justify-content:space-between;margin:.5rem 0 1rem;background:var(--field)}
.ai-box>div{flex:1 1 22rem} .ai-box p{margin:.25rem 0 0;color:var(--ink-2);font-size:.92rem;max-width:62ch}
.ai-msg,.ai-sum{flex-basis:100%;margin:0;font-size:.92rem}
.ai-sum{border-top:1px solid var(--line-2);padding-top:.6rem;font-style:italic}
.wks{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.25rem}
.wk{border:1px solid var(--line-2);border-radius:6px;padding:.6rem .75rem}
.wk.off{opacity:.55}
.wk-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
@media(max-width:759px){.wk-item{flex:1 1 calc(100% - 2rem)}.wk-cost{margin-left:1.6rem;margin-right:auto}}
.wk-more{margin-top:.4rem;font-size:.85rem}.wk-more summary{cursor:pointer;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-item{flex:1;font-weight:600;background:transparent;border-color:transparent}
.wk-item:hover,.wk-item:focus{border-color:var(--line);background:var(--field)}
.wk-cost{white-space:nowrap;font-size:.92rem}
.wk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem .6rem;margin-top:.5rem}
.wk-grid label{display:flex;flex-direction:column;gap:.15rem;font-size:.78rem;color:var(--ink-2)}
.wk-grid input,.wk-grid select{font-size:.88rem;padding:.3rem .4rem;color:var(--ink)}
.wk-grid .w2,.wk-grid .w4{grid-column:1/-1}
@media(min-width:760px){.wk-grid{grid-template-columns:repeat(8,1fr)}.wk-grid .w2{grid-column:span 4}.wk-grid .w4{grid-column:1/-1}}
.ai-tag{display:block;margin-top:.4rem;color:var(--gold)}
.tots{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-top:1.25rem}
.tot{border-top:3px solid var(--navy);padding-top:.6rem}
.tot dl{display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;margin:.25rem 0 .4rem}
.tot dt{color:var(--ink-2)} .tot dd{margin:0;text-align:right}
.tot .sum{font-weight:600;color:var(--ink);border-top:1px solid var(--line);padding-top:.3rem}

/* appraisal */
.duo{display:grid;grid-template-columns:1fr;gap:1.5rem;margin-top:1rem}
@media(min-width:860px){.duo{grid-template-columns:1fr 1fr}}
.col{border-top:3px solid var(--line)}
.col.ok{border-color:var(--pos)} .col.bad{border-color:var(--brick)}
.col h2{margin-top:.75rem}
.mao{margin-top:.75rem;padding:.7rem .9rem;border:1px solid var(--gold);border-radius:4px;display:flex;flex-direction:column;gap:.1rem}
.mao span{font-size:.85rem;color:var(--ink-2)} .mao b{font-family:var(--serif);font-size:1.3rem;color:var(--gold)}

/* verdict */
.verdict{display:grid;grid-template-columns:1fr;gap:.75rem 1.5rem;padding:1rem 1.2rem;border-radius:6px;border:1px solid var(--line);margin:.5rem 0}
@media(min-width:700px){.verdict{grid-template-columns:auto 1fr}}
.v-word{font-family:var(--serif);font-weight:700;font-size:2rem;line-height:1}
.verdict p{margin:0 0 .4rem} .verdict ul{margin:.25rem 0 0;padding-left:1.1rem}
.verdict.go{border-color:var(--pos)} .verdict.go .v-word{color:var(--pos)}
.verdict.cond{border-color:var(--gold)} .verdict.cond .v-word{color:var(--gold)}
.verdict.nogo{border-color:var(--brick)} .verdict.nogo .v-word{color:var(--brick)}
.flags{display:flex;flex-direction:column}
.flag{padding:.7rem 0;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:.45rem}
.flag-h{display:flex;flex-wrap:wrap;gap:.3rem .6rem;align-items:baseline}
.crit{font-size:.75rem;color:var(--brick);border:1px solid currentColor;border-radius:3px;padding:0 .3rem}
.flag-f{display:flex;flex-wrap:wrap;gap:.5rem}
.flag-f label{display:flex;flex-direction:column;font-size:.8rem;color:var(--ink-2);gap:.15rem;width:9rem}
.flag-f .grow{flex:1 1 14rem}
.flag-f input{color:var(--ink)}

/* deals */
.deal-list{list-style:none;margin:0;padding:0}
.deal-row{display:flex;align-items:center;gap:.75rem;border-bottom:1px solid var(--line-2);padding:.4rem 0}
.deal-open{flex:1;text-align:left;border:0;background:none;padding:.5rem .25rem;cursor:pointer;display:flex;flex-direction:column;gap:.05rem;min-width:0}
.deal-open b{font-family:var(--serif);font-size:1.1rem} .deal-open span{font-size:.88rem}
.deal-open:hover b{text-decoration:underline}
.pill{font-size:.75rem;font-weight:600;padding:.15rem .5rem;border-radius:3px;white-space:nowrap;border:1px solid currentColor}
.pill.go{color:var(--pos)} .pill.cond{color:var(--gold)} .pill.nogo{color:var(--brick)} .pill.inc{color:var(--ink-2)}
.empty{text-align:left;padding:2rem 0;max-width:52ch} .empty p{color:var(--ink-2)}
.empty.small{padding:.5rem 0}

/* settings */
.vers{display:flex;flex-direction:column;gap:.1rem}
.ver{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.ver b{font-weight:500;display:block} .ver input{margin-top:.2rem}

/* report */
.md{white-space:pre-wrap;background:var(--field);border:1px solid var(--line-2);border-radius:4px;padding:1rem;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;max-height:70vh}

/* ledger: the running deal position */
#ledger{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);color:#E7ECF3;
  padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr auto;gap:.35rem 1rem;align-items:center;
  box-shadow:0 -1px 0 rgba(0,0,0,.2)}
#ledger[hidden]{display:none}
.lg-name{font-family:var(--serif);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-name span{display:block;font-family:var(--sans);font-weight:400;font-size:.78rem;opacity:.7;text-transform:capitalize}
.lg-cell{display:none;flex-direction:column;font-size:.78rem}
.lg-cell span{opacity:.7} .lg-cell b{font-size:.98rem;font-weight:600;white-space:nowrap}
.lg-cell b small{font-weight:400;opacity:.75;font-size:.78rem;color:inherit}
.lg-cell b.neg{color:#F0A08D}
.lg-verdict{font-weight:700;font-size:.85rem;padding:.35rem .6rem;border-radius:3px;white-space:nowrap;border:1px solid rgba(231,236,243,.4)}
.lg-verdict.go{background:#2F6B4F;border-color:#2F6B4F} .lg-verdict.cond{background:#8A6508;border-color:#8A6508} .lg-verdict.nogo{background:#C1533C;border-color:#C1533C}
@media(min-width:760px){#ledger{grid-template-columns:minmax(0,1.3fr) repeat(3,auto) auto;padding-left:max(1rem,calc(50vw - 540px + 1rem));padding-right:max(1rem,calc(50vw - 540px + 1rem))}.lg-cell{display:flex}}
@media(max-width:759px){#ledger .lg-verdict{grid-row:1;grid-column:2}#ledger .lg-cell:nth-of-type(3){display:flex;grid-column:1/-1;flex-direction:row;gap:.5rem;align-items:baseline}}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:.55rem .9rem;border-radius:4px;z-index:40;font-size:.9rem;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">BMV Appraisal<span>2 and 3-bed · England</span></div>
  <span id="status" role="status">Loading…</span>
  <nav class="tabs" aria-label="Main">
    <button data-nav="deals">Assessments</button>
    <button data-nav="assess">Current deal</button>
    <button data-nav="rates">Rate library</button>
    <button data-nav="settings">Settings</button>
  </nav>
</div></header>
<main id="view"></main>
<footer id="ledger" hidden aria-label="Deal position"></footer>
<div id="toast" role="status" hidden></div>

  ["clearance", "Internal clearance and strip-out", "item", 400, 1000, "Externals"],
  ["garden", "Garden clearance and tidy", "item", 300, 900, "Externals"],

const RED_FLAGS = [

  ["nonstandard", "Non-standard or defective construction", true, "Surveyor / lender"],

const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

function deriveGrade(condition) {
  let cr3 = 0, structuralCR3 = false, medium = false, rated = 0;
  for (const [key, , cat] of ELEMENTS) {
    const c = condition?.[key]?.cr;
    if (!c) continue;
    rated++;
    if (c === 3) { cr3++; if (cat === "structural") structuralCR3 = true; }
    if ((cat === "services" || cat === "fitout" || cat === "safety") && c >= 2) medium = true;
    if (cat === "fabric" && c === 3) medium = true;
  }
  let grade = "light";
  if (structuralCR3 || cr3 >= 3) grade = "heavy";
  else if (medium) grade = "medium";
  return { grade, cr3, rated, total: ELEMENTS.length };
}

function sdlt(price, purchaser) {
  const bands = [[125000, 0], [250000, 0.02], [925000, 0.05], [1500000, 0.10], [Infinity, 0.12]];
  const surcharge = (purchaser === "company" || purchaser === "additional") && price >= 40000 ? 0.05 : 0;
  let tax = 0, lower = 0; const lines = [];
  for (const [upper, rate] of bands) {
    if (price <= lower) break;
    const slice = Math.min(price, upper) - lower;
    const r = rate + surcharge;
    tax += slice * r;
    lines.push({ from: lower, to: Math.min(price, upper), rate: r, tax: slice * r });
    lower = upper;
  }
  return { tax: Math.round(tax), lines, surcharge, note: purchaser === "company" && price > 500000 ? "Company purchase over £500k: 17% flat rate may apply unless a relief is claimed. Confirm with solicitor." : "" };
}

function corpTax(profit) {
  if (profit <= 0) return 0;
  if (profit <= 50000) return profit * 0.19;
  if (profit >= 250000) return profit * 0.25;
  return profit * 0.25 - 0.015 * (250000 - profit);
}

function comps(deal) {
  const rows = (deal.comps || []).filter(c => num(c.price) > 0);
  const agg = basis => {
    const set = rows.filter(r => r.basis === basis);
    let w = 0, s = 0;
    for (const r of set) { const wt = num(r.weight) || 1; s += num(r.price) * (1 + num(r.adjPct) / 100) * wt; w += wt; }
    return { value: w ? s / w : 0, n: set.length, set };
  };
  const asIs = agg("as-is"), refurb = agg("refurbished");
  const conf = set => {
    if (set.length < 2) return "Low";
    const now = Date.now();
    const recent = set.every(r => r.date && (now - new Date(r.date).getTime()) / 864e5 <= 730);
    const vals = set.map(r => num(r.price) * (1 + num(r.adjPct) / 100));
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    const spread = (Math.max(...vals) - Math.min(...vals)) / mean;
    if (set.length >= 3 && recent && spread <= 0.15) return "High";
    return "Medium";
  };
  const v = deal.value || {};
  const asIsValue = num(v.asIsOverride) || asIs.value;
  const arv = num(v.arvOverride) || refurb.value;
  return {
    asIsValue, arv,
    asIsFromComps: asIs.value, arvFromComps: refurb.value,
    asIsN: asIs.n, arvN: refurb.n,
    asIsConf: num(v.asIsOverride) ? "Override" : conf(asIs.set),
    arvConf: num(v.arvOverride) ? "Override" : conf(refurb.set)
  };
}

function worksTotals(deal, cfg, grade, mult = 1) {
  const basis = cfg.costBasis;
  const items = (deal.works || []).filter(w => w.include !== false);
  const cost = w => {
    const f = (w.src === "RATE" || w.src === "EST") ? num(cfg.regionalFactor) || 1 : 1;
    const q = num(w.qty) || 0;
    const lo = q * num(w.rMin) * f, hi = q * num(w.rMax || w.rMin) * f;
    return { lo, hi, mid: (lo + hi) / 2 };
  };
  const pick = c => basis === "min" ? c.lo : basis === "max" ? c.hi : c.mid;
  const scope = inScope => {
    let cons = 0, prof = 0, lo = 0, hi = 0, est = 0;
    for (const w of items) {
      if (!inScope(w)) continue;
      const c = cost(w), v = pick(c);
      if (w.cat === "Professional & statutory") prof += v; else cons += v;
      lo += c.lo; hi += c.hi;
      if (w.src === "EST") est += v;
    }
    // red flag mitigations
    for (const [k] of RED_FLAGS) {
      const f = deal.flags?.[k];
      if (f && f.status !== "Clear" && num(f.mitigation) > 0) cons += num(f.mitigation);
    }
    const estShare = (cons + prof) > 0 ? est / (cons + prof) : 0;
    cons *= mult;
    const contRate = cfg.contingency[grade] ?? 0.15;
    const contingency = cons * contRate;
    const total = cons + contingency + prof;
    return { construction: cons, professional: prof, contingency, contRate, total, lo, hi, estShare };
  };
  return {
    sell: scope(w => w.std === "SELL" || w.std === "BOTH"),
    let: scope(() => true),
    cost
  };
}

function appraise(deal, cfg, opt = {}) {
  const p = deal.property || {}, v = deal.value || {}, a = deal.auction || {};
  const price = opt.price ?? num(p.price);
  const cond = deriveGrade(deal.condition);
  const grade = cond.grade;
  const cmp = comps(deal);
  const arv = cmp.arv * (1 + (opt.arvDelta || 0));
  const rent = num(v.rentPcm) * (1 + (opt.rentDelta || 0));
  const rateBump = opt.rateDelta || 0;
  const wt = worksTotals(deal, cfg, grade, 1 + (opt.worksDelta || 0));
  const progMonths = (num(cfg.programmeWeeks[grade]) / 4.33) + (opt.programmeDelta || 0);

  const s = sdlt(price, cfg.purchaser);
  const auctionCosts = p.route === "auction" ? num(a.premium) + num(a.admin) + num(a.legalPack) : 0;
  const acquisition = price + s.tax + num(cfg.acq.legal) + num(cfg.acq.survey) + auctionCosts;
  const hold = num(cfg.holding.councilTaxMonthly) + num(cfg.holding.insuranceMonthly) + num(cfg.holding.utilitiesMonthly);

  const bridgeCost = (months, worksTotal) => {
    const L = price * num(cfg.bridge.ltv) + worksTotal * num(cfg.bridge.worksFunded);
    const rate = num(cfg.bridge.monthlyRate) + rateBump / 12;
    const interest = L * rate * months;
    const fees = L * num(cfg.bridge.arrFee) + L * num(cfg.bridge.exitFee) + L * num(cfg.bridge.brokerFee) + num(cfg.bridge.valuation) + num(cfg.bridge.legal);
    return { L, interest, fees, total: interest + fees, months };
  };

  // FLIP
  const fMonths = progMonths + num(cfg.sale.monthsToSell);
  const fb = bridgeCost(fMonths, wt.sell.total);
  const fHold = hold * fMonths;
  const saleCosts = arv * num(cfg.sale.agentPct) * 1.2 + num(cfg.sale.conveyancing);
  const fCost = acquisition + wt.sell.total + fb.total + fHold + saleCosts;
  const fProfit = arv - fCost;
  const fCashIn = fCost - saleCosts - fb.L;
  const fTax = corpTax(fProfit);
  const flip = {
    months: fMonths, bridge: fb, holding: fHold, saleCosts, works: wt.sell, totalCost: fCost, gdv: arv,
    profit: fProfit, profitOnCost: fCost ? fProfit / fCost : 0, profitOnGdv: arv ? fProfit / arv : 0,
    cashIn: fCashIn, roce: fCashIn > 0 ? fProfit / fCashIn : 0, roceAnnual: fCashIn > 0 && fMonths ? (fProfit / fCashIn) * 12 / fMonths : 0,
    tax: fTax, profitAfterTax: fProfit - fTax
  };
  flip.pass = flip.profitOnGdv >= cfg.targets.flipProfitOnGdv && flip.profitOnCost >= cfg.targets.flipProfitOnCost;

  // BRRR
  const bMonths = Math.max(progMonths + num(cfg.refi.processMonths), num(cfg.refi.minOwnMonths));
  const bb = bridgeCost(bMonths, wt.let.total);
  const bHold = hold * (progMonths + num(cfg.letting.monthsToLet));
  const bCost = acquisition + wt.let.total + bb.total + bHold;
  const refiVal = arv * (1 - num(cfg.refi.haircut));
  const ltvLoan = refiVal * num(cfg.refi.ltv);
  const stress = num(cfg.refi.stressRate) + rateBump;
  const icrMax = stress > 0 && cfg.refi.icr > 0 ? (rent * 12) / (stress * num(cfg.refi.icr)) : Infinity;
  const newLoan = Math.max(0, Math.min(ltvLoan, icrMax));
  const refiCosts = newLoan * num(cfg.refi.productFee) + num(cfg.refi.valuation) + num(cfg.refi.legal);
  const leftIn = bCost + refiCosts - newLoan;
  const gross = rent * 12;
  const voids = gross * num(cfg.letting.voids);
  const mgmt = (gross - voids) * num(cfg.letting.mgmt) * 1.2;
  const maint = gross * num(cfg.letting.maint);
  const other = num(cfg.letting.insuranceAnnual) + num(v.licensingAnnual) + num(p.groundRent) + num(p.serviceCharge);
  const netOp = gross - voids - mgmt - maint - other;
  const interest = newLoan * (num(cfg.refi.payRate) + rateBump);
  const cfAnnual = netOp - interest;
  const brrr = {
    months: bMonths, bridge: bb, holding: bHold, works: wt.let, totalCost: bCost,
    refiVal, ltvLoan, icrMax, newLoan, icrCapped: icrMax < ltvLoan, refiCosts, leftIn,
    gross, voids, mgmt, maint, other, netOp, interest, cfAnnual, cfMonthly: cfAnnual / 12,
    netYield: price ? netOp / price : 0,
    icrActual: newLoan ? gross / (newLoan * stress) : 0,
    roi: leftIn > 0 ? cfAnnual / leftIn : Infinity
  };
  brrr.pass = rent > 0 && brrr.leftIn <= cfg.targets.brrrMaxLeftIn && brrr.cfMonthly >= cfg.targets.brrrMinCashflow;

  return { price, grade, cond, cmp: { ...cmp, arv }, sdlt: s, auctionCosts, acquisition, progMonths, flip, brrr, rent };
}

function maxOffer(deal, cfg, strategy) {
  const test = price => {
    const r = appraise(deal, cfg, { price });
    return strategy === "flip" ? r.flip.pass : r.brrr.pass;
  };
  const cmp = comps(deal);
  if (!cmp.arv) return { value: null, reason: "No ARV yet" };
  if (strategy === "brrr" && !num(deal.value?.rentPcm)) return { value: null, reason: "No rent entered" };
  if (!test(1000)) {
    if (strategy === "brrr") {
      const r = appraise(deal, cfg, { price: 1000 });
      if (r.brrr.cfMonthly < cfg.targets.brrrMinCashflow) return { value: null, reason: "Cashflow target fails at any price" };
    }
    return { value: null, reason: "Targets fail at any price" };
  }
  let lo = 1000, hi = cmp.arv * 1.5;
  if (test(hi)) return { value: hi, reason: "Not constrained below 150% of ARV" };
  for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (test(mid)) lo = mid; else hi = mid; }
  const mao = Math.floor(lo / 500) * 500;
  const r = appraise(deal, cfg, { price: lo + 1000 });
  let binding = "";
  if (strategy === "flip") binding = r.flip.profitOnGdv < cfg.targets.flipProfitOnGdv ? "Profit on GDV target" : "Profit on cost target";
  else binding = r.brrr.leftIn > cfg.targets.brrrMaxLeftIn ? "Money-left-in target" : "Cashflow target";
  return { value: mao, binding };
}

const SCENARIOS = [
  ["Base case", {}],
  ["ARV −5%", { arvDelta: -0.05 }],
  ["ARV −10%", { arvDelta: -0.10 }],
  ["Works +15%", { worksDelta: 0.15 }],
  ["Works +30%", { worksDelta: 0.30 }],
  ["Programme +3 months", { programmeDelta: 3 }],
  ["Rates +1 point", { rateDelta: 0.01 }],
  ["Rent −10%", { rentDelta: -0.10 }],
  ["ARV −10% and works +15%", { arvDelta: -0.10, worksDelta: 0.15 }]
];

function sensitivity(deal, cfg) {
  return SCENARIOS.map(([label, o]) => {
    const r = appraise(deal, cfg, o);
    return { label, flip: r.flip, brrr: r.brrr };
  });
}

function verdict(deal, cfg) {
  const r = appraise(deal, cfg);
  const conditions = [], blockers = [];
  for (const [k, label, critical] of RED_FLAGS) {
    const f = deal.flags?.[k];
    if (!f) continue;
    if (f.status === "Confirmed" && critical && !(num(f.mitigation) > 0)) blockers.push(`${label}: confirmed with no costed mitigation`);
    else if (f.status === "Suspected") conditions.push(`Resolve suspected: ${label}`);
    else if (f.status === "Confirmed") conditions.push(`Confirmed and costed: ${label}`);
  }
  if (!r.cmp.arv) return { verdict: "INCOMPLETE", reason: "Add comparables or an ARV to appraise.", conditions, blockers, r };
  if (!r.price) return { verdict: "INCOMPLETE", reason: "Add the purchase price.", conditions, blockers, r };
  const stress = appraise(deal, cfg, { arvDelta: -0.10, worksDelta: 0.15 });
  const flipOK = r.flip.pass, brrrOK = r.brrr.pass;
  let rec = "None";
  if (flipOK && brrrOK) rec = "Either";
  else if (flipOK) rec = "Flip";
  else if (brrrOK) rec = "BRRR";
  if (r.cmp.arvConf === "Low") conditions.push("ARV confidence is low: add refurbished comparables");
  if (r.cond.rated < 10) conditions.push(`Only ${r.cond.rated} of ${r.cond.total} elements rated`);
  const est = Math.max(r.flip.works.estShare || 0, r.brrr.works.estShare || 0);
  if (est > 0.3) conditions.push(`${Math.round(est * 100)}% of works cost is AI or own estimate: get quotes`);
  if (r.brrr.icrCapped) conditions.push("Refinance loan limited by ICR, not LTV");
  if (!(deal.works || []).length) conditions.push("No works items yet");
  let v, reason;
  if (blockers.length) { v = "NO-GO"; reason = "Critical red flag without costed mitigation."; }
  else if (!flipOK && !brrrOK) { v = "NO-GO"; reason = "Base case misses targets for both strategies."; }
  else {
    const stressOK = (rec === "Flip" && stress.flip.pass) || (rec === "BRRR" && stress.brrr.pass) || (rec === "Either" && (stress.flip.pass || stress.brrr.pass));
    if (!stressOK) conditions.unshift("Fails the ARV −10% and works +15% stress test");
    const suspected = conditions.some(c => c.startsWith("Resolve suspected"));
    if (stressOK && !suspected && r.cmp.arvConf !== "Low") { v = "GO"; reason = "Passes base case and stress test."; }
    else { v = "CONDITIONAL GO"; reason = "Passes base case; clear the conditions below."; }
  }
  return { verdict: v, reason, recommended: rec, conditions, blockers, r, stress };
}

if (false && typeof module !== "undefined") module.exports = { DEFAULT_CFG, ELEMENTS, RED_FLAGS, deriveGrade, sdlt, corpTax, comps, worksTotals, appraise, maxOffer, sensitivity, verdict };

      const snap = await db.collection(`data/users/${id}`).get();
      for (const d of snap.docs) {
        const body = d.data();
        if (d.id.startsWith("deal-")) S.deals[d.id] = body;
        else if (d.id === "settings") { S.cfg = mergeCfg(body.cfg); S.verify = body.verify || {}; }
        else if (d.id === "rates" && Array.isArray(body.items)) S.rates = body.items;
      }
      return;
    }
  } catch (e) { console.warn("db unavailable", e); }
  S.store = "local";
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i); if (!k.startsWith("bmv:")) continue;
      const body = JSON.parse(localStorage.getItem(k)); const name = k.slice(4);
      if (name.startsWith("deal-")) S.deals[name] = body;
      else if (name === "settings") { S.cfg = mergeCfg(body.cfg); S.verify = body.verify || {}; }
      else if (name === "rates") S.rates = body.items;
    }
  } catch (e) { S.store = "none"; }
}
function mergeCfg(c) {
  const out = structuredClone(DEFAULT_CFG);
  for (const k in c || {}) out[k] = (typeof out[k] === "object" && out[k]) ? { ...out[k], ...c[k] } : c[k];
  return out;
}

/* ===== Form fields ===== */
function field(label, path, opts = {}) {
  const src = opts.src || "deal";
  const obj = src === "cfg" ? S.cfg : deal();
  let v = get(obj, path);
  const t = opts.t || "text";
  const attrs = `data-k="${path}" data-src="${src}" data-t="${t}" id="f-${path.replace(/\./g, "-")}"`;
  let input;
  if (opts.options) {
    input = `<select ${attrs}>${opts.options.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}"${String(v) === String(val) ? " selected" : ""}>${esc(lab)}</option>`; }).join("")}</select>`;
  } else if (t === "area") {
    input = `<textarea ${attrs} rows="3">${esc(v)}</textarea>`;
  } else {
    if (t === "pct" && v !== undefined && v !== "") v = +(v * 100).toFixed(3);
    const it = t === "num" || t === "pct" ? `type="number" inputmode="decimal" step="any"` : t === "date" ? `type="date"` : `type="text"`;
    input = `<div class="inp${opts.pre ? " has-pre" : ""}${t === "pct" || opts.suf ? " has-suf" : ""}">${opts.pre ? `<i>${opts.pre}</i>` : ""}<input ${it} ${attrs} value="${esc(v ?? "")}" placeholder="${esc(opts.ph || "")}">${t === "pct" ? "<i>%</i>" : opts.suf ? `<i>${opts.suf}</i>` : ""}</div>`;
  }
  return `<label class="fld${opts.wide ? " wide" : ""}" for="f-${path.replace(/\./g, "-")}"><span>${label}</span>${input}${opts.hint ? `<small>${opts.hint}</small>` : ""}</label>`;
}
function readVal(el) {
  const t = el.dataset.t;
  if (t === "num") return el.value === "" ? "" : parseFloat(el.value);
  if (t === "pct") return el.value === "" ? 0 : parseFloat(el.value) / 100;
  return el.value;
}

  <div class="duo">

      ${row("GDV (ARV)", gbp(f.gdv))}

function stepVerdict() {
  const d = deal();
  const flags = RED_FLAGS.map(([k, label, crit, who]) => {
    const f = d.flags[k] || {};
    const st = f.status || "";
    return `<div class="flag"><div class="flag-h"><b>${label}</b>${crit ? `<span class="crit">Critical</span>` : ""}<small>Verify: ${who}</small></div>
      <div class="seg" role="radiogroup" aria-label="${esc(label)} status">${["Clear", "Suspected", "Confirmed"].map(s => `<button role="radio" aria-checked="${st === s}" class="fs fs-${s.toLowerCase()}" data-act="flag" data-k="${k}" data-s="${s}">${s}</button>`).join("")}</div>
      ${st && st !== "Clear" ? `<div class="flag-f"><label><span>Mitigation cost £</span><input type="number" inputmode="decimal" data-flag="${k}" data-f="mitigation" value="${esc(f.mitigation)}"></label><label class="grow"><span>Note</span><input data-flag="${k}" data-f="note" value="${esc(f.note)}"></label></div>` : ""}
    </div>`;
  }).join("");
  return `<h1>Red flags and verdict</h1><div data-calc="verdict"></div><h2>Red-flag screen</h2><p class="lede">Costed mitigations are added to both works scopes. A confirmed critical flag without a cost forces NO-GO.</p><div class="flags">${flags}</div>`;
}

function verdictHTML() {
  const d = deal(), v = verdict(d, S.cfg);
  const cls = { "GO": "go", "CONDITIONAL GO": "cond", "NO-GO": "nogo" }[v.verdict] || "inc";
  const list = a => a.length ? `<ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  return `<div class="verdict ${cls}"><div class="v-word">${v.verdict}</div><div><p>${esc(v.reason)}</p>${v.recommended && v.recommended !== "None" ? `<p>Recommended strategy: <b>${v.recommended}</b></p>` : ""}${list(v.blockers)}${v.conditions.length ? `<h3>Conditions</h3>${list(v.conditions)}` : ""}</div></div>
  <h2>Next actions</h2>${list(nextActions(d, v)) || `<p class="muted">None flagged.</p>`}`;
}

function nextActions(d, v) {
  const a = [];
  for (const [k, label, , who] of RED_FLAGS) { const f = d.flags[k]; if (f?.status === "Suspected") a.push(`${who}: investigate ${label.toLowerCase()}`); }
  const est = d.works.filter(w => w.include !== false && w.src === "EST");
  if (est.length) a.push(`Get quotes for ${est.length} estimated item${est.length > 1 ? "s" : ""}, starting with ${est.slice(0, 3).map(w => w.item).join(", ")}`);
  if (v.r?.cmp.arvConf === "Low") a.push("Add at least three recent refurbished comparables");
  const unconf = VERIFY.filter(([k]) => !S.verify[k]?.ok);
  if (unconf.length) a.push(`Confirm ${unconf.length} open item${unconf.length > 1 ? "s" : ""} in the Settings verification register`);
  if (v.recommended === "BRRR" || v.recommended === "Either") a.push("Broker: confirm refinance LTV, ICR and minimum-ownership rule; get an Agreement in Principle");
  if (d.property.route === "auction") a.push("Solicitor: review the legal pack and special conditions before bidding");
  return a;
}

/* ===== Report ===== */
function reportMD() {
  const d = deal(), v = verdict(d, S.cfg), r = v.r, f = r.flip, b = r.brrr, p = d.property;
  const t = (h, rows) => `| ${h.join(" | ")} |\n|${h.map(() => "---").join("|")}|\n${rows.map(x => `| ${x.join(" | ")} |`).join("\n")}\n`;
  const g = deriveGrade(d.condition);
  const mf = maxOffer(d, S.cfg, "flip"), mb = maxOffer(d, S.cfg, "brrr");
  let md = `# BMV assessment: ${p.name || p.address || "Untitled"}\n\n_Generated ${new Date().toLocaleString("en-GB")} · rules as at ${S.cfg.asAt}_\n\n## 1. Deal snapshot\n\n`;
  md += t(["Field", "Value"], [["Address", `${p.address || ""} ${p.postcode || ""}`], ["Type / beds / area", `${p.type}, ${p.beds}-bed, ${p.gia || "?"} m²`], ["Tenure", p.tenure + (p.tenure === "Leasehold" ? ` (${p.leaseYears || "?"} yrs)` : "")], ["Price", gbp(r.price)], ["As-is value", gbp(r.cmp.asIsValue) + ` (${r.cmp.asIsConf})`], ["BMV vs as-is", r.cmp.asIsValue ? pct((r.cmp.asIsValue - r.price) / r.cmp.asIsValue) : "—"], ["ARV", gbp(r.cmp.arv) + ` (${r.cmp.arvConf})`], ["Derived grade", g.grade], ["Standard", p.standard], ["Verdict", `**${v.verdict}**`], ["Recommended", v.recommended || "—"]]);
  md += `\n## 2. Condition\n\n` + t(["Element", "Rating", "Note"], ELEMENTS.filter(([k]) => d.condition[k]?.cr).map(([k, l]) => [l, "CR" + d.condition[k].cr, d.condition[k].note || ""]));
  md += `\n${g.rated} of ${g.total} elements rated; ${g.cr3} at CR3.\n\n## 3. Comparables\n\n` + t(["Address", "Sold", "Price", "Condition", "Adj %", "Weight"], d.comps.map(c => [c.addr || "", c.date || "", gbp(c.price), c.basis, c.adjPct || 0, c.weight ?? 1]));
  md += `\n## 4. Works and costs (${S.cfg.costBasis} basis)\n\n` + t(["Item", "Category", "Std", "Qty", "Rate £", "Cost £", "Source", "Priority", "Reg ref", "Cert"], d.works.filter(w => w.include !== false).map(w => { const c = worksTotals(d, S.cfg, g.grade).cost(w); return [w.item, w.cat, w.std, `${w.qty} ${w.unit || ""}`, `${w.rMin}–${w.rMax}`, `${gbp(c.lo)}–${gbp(c.hi)}`, `[${w.src}]`, w.priority, w.reg || "", w.cert || ""]; }));
  md += `\n| Scope | Construction | Contingency | Professional | Total |\n|---|---|---|---|---|\n| Sell | ${gbp(f.works.construction)} | ${gbp(f.works.contingency)} | ${gbp(f.works.professional)} | ${gbp(f.works.total)} |\n| Let | ${gbp(b.works.construction)} | ${gbp(b.works.contingency)} | ${gbp(b.works.professional)} | ${gbp(b.works.total)} |\n`;
  md += `\n## 5. Flip vs BRRR\n\n` + t(["Measure", "Flip", "BRRR"], [["Total cost", gbp(f.totalCost), gbp(b.totalCost)], ["Months", f.months.toFixed(1), b.months.toFixed(1)], ["Profit / money left in", gbp(f.profit), gbp(b.leftIn)], ["% GDV / cashflow pcm", pct(f.profitOnGdv), gbp(b.cfMonthly)], ["Return", pct(f.roceAnnual) + " annualised", b.leftIn > 0 ? pct(b.roi) : "Infinite"], ["Maximum offer", mf.value ? gbp(mf.value) : mf.reason, mb.value ? gbp(mb.value) : mb.reason], ["Pass", f.pass ? "Yes" : "No", b.pass ? "Yes" : "No"]]);
  md += `\nSDLT: ${gbp(r.sdlt.tax)} (${S.cfg.purchaser}). Indicative corporation tax on flip: ${gbp(f.tax)}. Accountant to confirm.\n\n### Sensitivity\n\n` + t(["Scenario", "Flip profit", "% GDV", "BRRR left in", "Cashflow pcm"], sensitivity(d, S.cfg).map(s => [s.label, gbp(s.flip.profit), pct(s.flip.profitOnGdv), gbp(s.brrr.leftIn), gbp(s.brrr.cfMonthly)]));
  md += `\n## 6. Red flags\n\n` + t(["Flag", "Status", "Mitigation", "Note"], RED_FLAGS.filter(([k]) => d.flags[k]?.status).map(([k, l]) => [l, d.flags[k].status, d.flags[k].mitigation ? gbp(d.flags[k].mitigation) : "", d.flags[k].note || ""]));
  md += `\n**Verdict: ${v.verdict}.** ${v.reason}\n\n${[...v.blockers, ...v.conditions].map(c => `- ${c}`).join("\n")}\n\n## 7. Assumptions\n\n- Finance, targets and holding costs from Settings as at ${S.cfg.asAt}.\n- Rate library items marked [RATE] are illustrative unless replaced with validated rates.\n- [EST] items are estimates and unvalidated.\n\n## 8. Verification register\n\n` + t(["Item", "Confirm with", "Status"], VERIFY.map(([k, l, w]) => [l, w, S.verify[k]?.ok ? `Confirmed ${S.verify[k].date}` : "Open"]));
  md += `\n## 9. Next actions\n\n${nextActions(d, v).map((a, i) => `${i + 1}. ${a}`).join("\n")}\n\n_Illustrative appraisal only. Not legal, tax, survey or financial advice. Verify all flagged items with qualified professionals before committing funds._\n`;
  return md;
}

/* ===== AI drafting ===== */
function aiPrompt(d) {
  const lib = S.rates.map(r => `${r.key} | ${r.item} | ${r.unit}`).join("\n");
  const cond = ELEMENTS.filter(([k]) => d.condition[k]?.cr).map(([k, l]) => `${l}: CR${d.condition[k].cr}${d.condition[k].note ? " (" + d.condition[k].note + ")" : ""}`).join("\n") || "No elements rated.";
  return `You are a UK residential quantity surveyor and PRS compliance specialist working in England. Draft the works checklist needed to bring this property to the selected standard.

STANDARDS
SELL = mortgageable and habitable: no CR3 defects a lender valuer would retain against; Building Regs sign-off for notifiable works (Part P electrics, Gas Safe boiler, FENSA/Certass windows, Part A structural, Part L thermal elements, Part F ventilation, Part B fire, Part K guarding).
LET = everything in SELL plus PRS compliance: Gas Safety Record; EICR with C1/C2/FI remedied; smoke alarm each storey and CO alarm where fixed combustion appliance; MEES minimum EPC; no HHSRS Category 1 hazards (damp and mould, excess cold, falls, fire, electrical); Decent Homes Standard / Awaab's Law as applicable.
Selected standard: ${d.property.standard}. Tag each item std SELL (needed to sell, also needed to let), LET (needed only to let) or BOTH. Use BOTH for most physical works; LET for PRS-only items like EICR/gas certificates and HHSRS-only upgrades.

RULES
- Only include items triggered by a condition finding, the property facts, or the selected standard. No generic padding.
- Quantities: derive from floor area (${d.property.gia || "unknown"} m²), ${d.property.beds} beds, property type. If area unknown assume ${d.property.beds === "3" ? 80 : 65} m² GIA and say so in desc.
- Pricing: if a rate library key fits, set rateKey to it and leave estMin/estMax 0. Otherwise set rateKey null and give estMin/estMax as a per-unit rate range in GBP for North West England.
- Categories must be one of: ${CATS.join("; ")}.
- Priority must be one of: Critical (safety, legal, mortgage/letting blocker), Required (needed for the standard), Value-add, Optional.
- reg: cite the regulation or standard briefly. cert: certificate or sign-off produced, or "".
- Flags: suggest red flags from this list only where the facts give reason to suspect them: ${RED_FLAGS.map(f => f[0]).join(", ")}.

PROPERTY
${JSON.stringify({ type: d.property.type, beds: d.property.beds, gia: d.property.gia, tenure: d.property.tenure, leaseYears: d.property.leaseYears, construction: d.property.construction, era: d.property.era, epc: d.property.epc, heating: d.property.heating, route: d.property.route, notes: d.property.notes })}

CONDITION (RICS ratings)
${cond}

RATE LIBRARY (key | item | unit)
${lib}

Reply with JSON only, no other text:
{"works":[{"item":"","cat":"","desc":"","std":"SELL|LET|BOTH","qty":1,"unit":"","rateKey":null,"estMin":0,"estMax":0,"priority":"","reg":"","cert":""}],"flags":[{"key":"","note":""}],"summary":"two sentences on scope and main risks"}`;
}

async function aiDraft() {
  const d = deal(); if (!S.sample || S.aiBusy) return;
  S.aiBusy = true; S.aiMsg = "Thinking… this usually takes 20–60 seconds."; S.aiCtl = new AbortController(); render();
  try {
    const res = await S.sample.json(aiPrompt(d), { signal: S.aiCtl.signal, modelTier: "default", cache: false });
    const works = Array.isArray(res?.works) ? res.works : [];
    const lib = Object.fromEntries(S.rates.map(r => [r.key, r]));
    const drafted = works.map(w => {
      const r = w.rateKey && lib[w.rateKey];
      return {
        id: uid(), ai: true, include: true, item: String(w.item || "Untitled item"), cat: CATS.includes(w.cat) ? w.cat : (r?.cat || CATS[0]),
        desc: String(w.desc || ""), std: ["SELL", "LET", "BOTH"].includes(w.std) ? w.std : "BOTH", qty: +w.qty || 1, unit: w.unit || r?.unit || "item",
        rMin: r ? r.min : +w.estMin || 0, rMax: r ? r.max : +w.estMax || +w.estMin || 0, src: r ? "RATE" : "EST", rateKey: r ? r.key : null,
        priority: PRIORITIES.includes(w.priority) ? w.priority : "Required", reg: String(w.reg || ""), cert: String(w.cert || "")
      };
    });
    d.works = [...d.works.filter(w => !w.ai || w.edited), ...drafted];
    const keys = RED_FLAGS.map(f => f[0]);
    for (const fl of (res?.flags || [])) {
      if (!keys.includes(fl.key)) continue;
      if (!d.flags[fl.key]?.status) d.flags[fl.key] = { status: "Suspected", note: "Claude: " + (fl.note || "") };
    }
    d.aiSummary = res?.summary ? String(res.summary) : "";
    S.aiMsg = `Drafted ${drafted.length} items. Review quantities and sources before relying on totals.`;
    saveDeal(d);
  } catch (e) {
    const m = { cancelled: "Drafting stopped.", not_granted: "Claude access wasn't allowed, so drafting is off for this visit. Add items manually.", rate_limited: "Too many requests just now. Wait a minute, then try again.", invalid_json: "Claude's reply couldn't be read. Try drafting again.", prompt_too_large: "Too much data to send. Shorten the notes, then try again." };
    S.aiMsg = m[e?.code] || "Drafting failed. Try again, or add items manually.";
    if (e?.code === "not_granted") S.sample = null;
  } finally { S.aiBusy = false; S.aiCtl = null; render(); }
}

/* ===== Downloads ===== */
async function download(filename, data) {
  if (S.downloads) {
    try { await S.downloads.save({ filename, data }); toast("Downloaded " + filename); return; }
    catch (e) { if (e?.code === "declined") return; }
  }
  try { await navigator.clipboard.writeText(data); toast("Download isn't available here, so the content was copied instead."); }
  catch { toast("Download isn't available here. Use Copy report instead."); }
}
const slug = d => (d.property.name || d.property.address || "deal").replace(/[^a-z0-9]+/gi, "-").toLowerCase().slice(0, 40);

/* ===== Events ===== */
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (nav && !nav.disabled) { S.view = nav.dataset.nav; render(); window.scrollTo(0, 0); return; }
  const st = e.target.closest("[data-step]");
  if (st) { S.step = st.dataset.step; S.aiMsg = S.aiBusy ? S.aiMsg : ""; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, d = deal();
  switch (act) {
    case "new-deal": { const n = newDeal(); S.deals[n.id] = n; S.currentId = n.id; S.view = "assess"; S.step = "property"; saveDeal(n); render(); break; }
    case "open": S.currentId = b.dataset.id; S.view = "assess"; S.step = "property"; render(); break;
    case "del-deal": {
      const x = S.deals[b.dataset.id];
      if (!confirm(`Delete "${x.property.name || x.property.address || "Untitled deal"}"? This can't be undone.`)) return;
      delete S.deals[b.dataset.id]; if (S.currentId === b.dataset.id) S.currentId = null;
      removeDoc(b.dataset.id).catch(() => toast("Couldn't delete from storage. Try again."));
      render(); break;
    }
    case "add-comp": d.comps.push({ addr: "", date: "", price: "", basis: "as-is", adjPct: 0, weight: 1 }); saveDeal(d); render(); break;
    case "del-comp": d.comps.splice(+b.dataset.i, 1); saveDeal(d); render(); break;
    case "cr": {
      const k = b.dataset.el, n = +b.dataset.n; const c = d.condition[k] = d.condition[k] || {};
      c.cr = c.cr === n ? null : n; saveDeal(d);
      b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-checked", String(+x.dataset.n === c.cr)));
      refreshCalc(); break;
    }
    case "flag": { const k = b.dataset.k, s = b.dataset.s; d.flags[k] = { ...(d.flags[k] || {}), status: d.flags[k]?.status === s ? "" : s }; saveDeal(d); render(); break; }
    case "add-w": d.works.push({ id: uid(), include: true, item: "", cat: CATS[0], std: "BOTH", qty: 1, unit: "item", rMin: 0, rMax: 0, src: "USER", priority: "Required", reg: "", cert: "", desc: "" }); saveDeal(d); render(); break;
    case "del-w": d.works.splice(+b.dataset.i, 1); saveDeal(d); render(); break;
    case "ai-draft": aiDraft(); break;
    case "ai-stop": S.aiCtl?.abort(); break;
    case "add-rate": S.rates.push({ key: "custom_" + uid(), item: "", unit: "item", min: 0, max: 0, cat: CATS[0], source: "", date: new Date().toISOString().slice(0, 7) }); saveRates(); render(); break;
    case "del-rate": S.rates.splice(+b.dataset.i, 1); saveRates(); render(); break;
    case "reset-rates": if (confirm("Replace your rate library with the illustrative seed rates?")) { S.rates = structuredClone(SEED_RATES); saveRates(); render(); } break;
    case "dl-md": download(`bmv-${slug(d)}.md`, reportMD()); break;
    case "dl-json": { const v = verdict(d, S.cfg); download(`bmv-${slug(d)}.json`, JSON.stringify({ deal: d, settings: S.cfg, results: { appraisal: v.r, verdict: v.verdict, recommended: v.recommended, conditions: v.conditions, blockers: v.blockers, maxOffer: { flip: maxOffer(d, S.cfg, "flip"), brrr: maxOffer(d, S.cfg, "brrr") } } }, (k, val) => val === Infinity ? "Infinity" : val, 2)); break; }
    case "copy-md": navigator.clipboard.writeText(reportMD()).then(() => toast("Report copied"), () => toast("Couldn't copy. Select the text below instead.")); break;
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "rate-pick" && el.value) {
    const r = S.rates.find(x => x.key === el.value), d = deal();
    d.works.push({ id: uid(), include: true, item: r.item, cat: r.cat || CATS[0], std: "BOTH", qty: 1, unit: r.unit, rMin: r.min, rMax: r.max, src: "RATE", rateKey: r.key, priority: "Required", reg: "", cert: "", desc: "" });
    saveDeal(d); render(); return;
  }
  if (el.dataset.verify) {
    S.verify[el.dataset.verify] = el.checked ? { ok: true, date: new Date().toLocaleDateString("en-GB") } : { ok: false };
    saveCfg(); render(); return;
  }
  // selects that change layout
  if (el.dataset.k && ["property.tenure", "property.route"].includes(el.dataset.k)) { onInput(e); render(); }
  if (el.dataset.w !== undefined && el.dataset.f === "include") { onInput(e); render(); }
});

function onInput(e) {
  const el = e.target, d = deal();
  if (el.dataset.k) {
    const obj = el.dataset.src === "cfg" ? S.cfg : d;
    set(obj, el.dataset.k, readVal(el));
    el.dataset.src === "cfg" ? saveCfg() : saveDeal(d);
  } else if (el.dataset.comp !== undefined) {
    const c = d.comps[+el.dataset.comp]; c[el.dataset.f] = el.type === "number" ? el.value : el.value; saveDeal(d);
  } else if (el.dataset.cnote) {
    (d.condition[el.dataset.cnote] = d.condition[el.dataset.cnote] || {}).note = el.value; saveDeal(d); return;
  } else if (el.dataset.w !== undefined) {
    const w = d.works[+el.dataset.w]; const f = el.dataset.f;
    w[f] = el.type === "checkbox" ? el.checked : el.value; w.edited = true;
    const costEl = el.closest(".wk")?.querySelector(".wk-cost");
    if (costEl) { const c = worksTotals(d, S.cfg, deriveGrade(d.condition).grade).cost(w); costEl.textContent = `${gbp(c.lo)} – ${gbp(c.hi)}`; }
    saveDeal(d);
  } else if (el.dataset.flag) {
    d.flags[el.dataset.flag][el.dataset.f] = el.value; saveDeal(d);
  } else if (el.dataset.r !== undefined) {
    const r = S.rates[+el.dataset.r]; r[el.dataset.f] = el.type === "number" ? parseFloat(el.value) || 0 : el.value; saveRates(); return;
  } else return;
  refreshCalc();
}
document.addEventListener("input", e => { if (e.target.tagName !== "SELECT") onInput(e); });
document.addEventListener("change", e => { if (e.target.tagName === "SELECT" && !(e.target.dataset.k && ["property.tenure", "property.route"].includes(e.target.dataset.k)) && e.target.id !== "rate-pick") onInput(e); });

/* ===== Boot ===== */
render();
(async () => {
  await initStore();
  render();
  if (!window.claude?.use) return;
  claude.use("sample").then(s => { S.sample = s; if (S.view === "assess" && S.step === "works") render(); });
  claude.use("downloads").then(dl => { S.downloads = dl; });
})();
</script>
</body>
</html>
